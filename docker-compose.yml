version: "3.8"
services:
  portfolio:
    container_name: sajib-portfolio
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - sajib-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  sajib-net:
    external: true
